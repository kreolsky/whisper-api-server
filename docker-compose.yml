services:
  whisper-api:
    build: .
    image: whisper-api:latest
    restart: unless-stopped
    # Prod-конфиг вынесен в отдельный version-контролируемый файл; generic
    # config.json остаётся эталоном/дефолтом для dev. Команда переопределяет
    # CMD из Dockerfile.
    command: ["python", "server.py", "--config", "config.orange.json"]
    ports:
      - "5042:5042"
    environment:
      # gigaam разрешает кэш через os.path.expanduser("~/.cache/gigaam"),
      # т.е. относительно HOME. Контейнер работает от root (HOME=/root),
      # кэш с предзагруженными весами проброшен с хоста.
      - HOME=/root
    volumes:
      - .:/app                                                          # код — обновление без пересборки
      - /home/text-generation/models:/home/text-generation/models:ro   # модели (whisper, сегментация)
      - /home/text-generation/.cache/gigaam:/root/.cache/gigaam        # веса gigaam (символическая ссылка на реальный кэш на хосте)
      - whisper-logs:/app/logs                                          # логи переживают пересоздание контейнера
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all                                               # нужны обе GPU (gigaam на 0, multilingual на 1)
              capabilities: [gpu]

volumes:
  whisper-logs:
